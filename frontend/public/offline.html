<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1114">
  <title>Offline · Vibe Code Auditor</title>
  <style>
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #0f1114;
      color: #f2f0ea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.55;
    }
    main { max-width: 32rem; }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { margin: 0 0 16px; color: #d8d8d2; }
    a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 11px;
      color: #f2f0ea;
      font-weight: 600;
    }
    a:focus-visible { outline: 3px solid #f2f0ea; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline.</h1>
    <p>Vibe Code Auditor needs a network connection to reach the audit server. Nothing is saved on this device while you are offline. Reconnect, then try again.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
